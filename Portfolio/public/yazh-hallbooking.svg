<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101522"/>
      <stop offset="50%" stop-color="#080a0d"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>
    <filter id="glowHall" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#hallBg)"/>
  
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <circle cx="670" cy="130" r="140" fill="#6f82ff" opacity="0.07" filter="url(#glowHall)"/>
  <circle cx="150" cy="390" r="130" fill="#d8ff55" opacity="0.06" filter="url(#glowHall)"/>

  <!-- Browser Frame -->
  <rect x="70" y="50" width="660" height="400" rx="14" fill="#0d1117" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  
  <!-- Browser Header -->
  <rect x="70" y="50" width="660" height="46" rx="14" fill="#131822" stroke="#ffffff" stroke-opacity="0.07"/>
  <circle cx="98" cy="73" r="5" fill="#ff5f56"/>
  <circle cx="114" cy="73" r="5" fill="#ffbd2e"/>
  <circle cx="130" cy="73" r="5" fill="#27c93f"/>
  
  <rect x="160" y="61" width="370" height="24" rx="6" fill="#080a0d" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="345" y="77" fill="#8b949e" font-family="'DM Sans', monospace" font-size="11" text-anchor="middle">https://corporatehallbooking.vercel.app/</text>
  
  <rect x="550" y="62" width="70" height="22" rx="5" fill="#6f82ff" fill-opacity="0.18"/>
  <text x="585" y="77" fill="#6f82ff" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">REACT APP</text>

  <!-- Website Content Preview -->
  <rect x="100" y="115" width="600" height="150" rx="10" fill="#11161f" stroke="#ffffff" stroke-opacity="0.06"/>
  
  <text x="130" y="150" fill="#6f82ff" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1">CORPORATE EVENT MANAGEMENT</text>
  <text x="130" y="185" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="24" font-weight="800">YAZH CORPORATE HALL BOOKING</text>
  <text x="130" y="210" fill="#88929b" font-family="'DM Sans', sans-serif" font-size="13">Interactive hall selection, booking workflows, and responsive UI built with React.</text>
  
  <rect x="130" y="228" width="115" height="26" rx="6" fill="#6f82ff"/>
  <text x="187" y="245" fill="#ffffff" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Book A Hall →</text>

  <!-- Hall Cards Preview -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="190" height="145" rx="8" fill="#11161f" stroke="#ffffff" stroke-opacity="0.06"/>
    <rect x="15" y="15" width="160" height="65" rx="6" fill="#18202b"/>
    <text x="95" y="52" fill="#d8ff55" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🏢 Grand Banquet</text>
    <text x="15" y="105" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="13" font-weight="700">500+ Capacity</text>
    <text x="15" y="125" fill="#88929b" font-family="'DM Sans', sans-serif" font-size="11">Audio, projector &amp; AC</text>

    <rect x="205" y="0" width="190" height="145" rx="8" fill="#11161f" stroke="#ffffff" stroke-opacity="0.06"/>
    <rect x="220" y="15" width="160" height="65" rx="6" fill="#18202b"/>
    <text x="300" y="52" fill="#6f82ff" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🎯 Conference Suite</text>
    <text x="220" y="105" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="13" font-weight="700">100+ Capacity</text>
    <text x="220" y="125" fill="#88929b" font-family="'DM Sans', sans-serif" font-size="11">High speed networking</text>

    <rect x="410" y="0" width="190" height="145" rx="8" fill="#11161f" stroke="#ffffff" stroke-opacity="0.06"/>
    <rect x="425" y="15" width="160" height="65" rx="6" fill="#18202b"/>
    <text x="505" y="52" fill="#ff9f43" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" text-anchor="middle">📅 Real-time Dates</text>
    <text x="425" y="105" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="13" font-weight="700">Instant Availability</text>
    <text x="425" y="125" fill="#88929b" font-family="'DM Sans', sans-serif" font-size="11">React state management</text>
  </g>
</svg>

