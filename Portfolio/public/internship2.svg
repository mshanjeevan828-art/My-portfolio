<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131b"/>
      <stop offset="50%" stop-color="#080a0d"/>
      <stop offset="100%" stop-color="#141a24"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <circle cx="200" cy="140" r="130" fill="#d8ff55" opacity="0.06" filter="url(#glow2)"/>
  <circle cx="620" cy="360" r="140" fill="#6f82ff" opacity="0.07" filter="url(#glow2)"/>

  <!-- Main Card -->
  <rect x="90" y="60" width="620" height="380" rx="14" fill="#0d1117" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  
  <rect x="90" y="60" width="620" height="48" rx="14" fill="#131820" stroke="#ffffff" stroke-opacity="0.07"/>
  <circle cx="120" cy="84" r="5" fill="#ff5f56"/>
  <circle cx="138" cy="84" r="5" fill="#ffbd2e"/>
  <circle cx="156" cy="84" r="5" fill="#27c93f"/>
  <text x="400" y="89" fill="#88929b" font-family="'DM Sans', -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">OPPORTUNITY // INTERNSHIP_SEARCH.md</text>

  <!-- Big Banner Card -->
  <rect x="120" y="135" width="560" height="270" rx="12" fill="#11161d" stroke="#ffffff" stroke-opacity="0.08"/>
  
  <rect x="150" y="165" width="160" height="26" rx="6" fill="#d8ff55" fill-opacity="0.12" stroke="#d8ff55" stroke-opacity="0.3"/>
  <circle cx="165" cy="178" r="4" fill="#d8ff55"/>
  <text x="235" y="182" fill="#d8ff55" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">AVAILABLE FOR HIRE</text>

  <text x="150" y="235" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="28" font-weight="800">Summer &amp; Fall Internships</text>
  <text x="150" y="265" fill="#88929b" font-family="'DM Sans', sans-serif" font-size="14">Seeking roles in Full-Stack Engineering, Frontend Craft &amp; AI Systems.</text>

  <!-- Tag Pills -->
  <g transform="translate(150, 305)">
    <rect x="0" y="0" width="120" height="32" rx="8" fill="#18202b" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="60" y="20" fill="#cfd6de" font-family="'DM Sans', sans-serif" font-size="12" text-anchor="middle">⚡ Fast Learner</text>

    <rect x="132" y="0" width="135" height="32" rx="8" fill="#18202b" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="199" y="20" fill="#cfd6de" font-family="'DM Sans', sans-serif" font-size="12" text-anchor="middle">💻 React &amp; Node.js</text>

    <rect x="279" y="0" width="145" height="32" rx="8" fill="#18202b" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="351" y="20" fill="#cfd6de" font-family="'DM Sans', sans-serif" font-size="12" text-anchor="middle">🎯 Immediate Joiner</text>
  </g>

  <g transform="translate(150, 355)">
    <text x="0" y="20" fill="#d8ff55" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">Ready to contribute to real-world teams →</text>
  </g>
</svg>

