<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#080a0d"/>
      <stop offset="100%" stop-color="#11161d"/>
    </linearGradient>
    <linearGradient id="neonGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8ff55" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#88c030" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad1)"/>
  
  <!-- Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Ambient light -->
  <circle cx="650" cy="120" r="140" fill="#d8ff55" opacity="0.07" filter="url(#glow1)"/>
  <circle cx="150" cy="380" r="120" fill="#6f82ff" opacity="0.06" filter="url(#glow1)"/>

  <!-- Window Container -->
  <rect x="90" y="60" width="620" height="380" rx="14" fill="#0d1117" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="90" y="60" width="620" height="48" rx="14" fill="#131820" stroke="#ffffff" stroke-opacity="0.07"/>
  <circle cx="120" cy="84" r="5" fill="#ff5f56"/>
  <circle cx="138" cy="84" r="5" fill="#ffbd2e"/>
  <circle cx="156" cy="84" r="5" fill="#27c93f"/>
  <text x="400" y="89" fill="#88929b" font-family="'DM Sans', -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">INTERNSHIP // FULL_STACK_DEV.tsx</text>

  <!-- Code / Dashboard Card Left -->
  <rect x="120" y="135" width="260" height="270" rx="10" fill="#11161d" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="140" y="160" width="70" height="20" rx="4" fill="#d8ff55" fill-opacity="0.15"/>
  <text x="175" y="174" fill="#d8ff55" font-family="'DM Sans', monospace" font-size="10" font-weight="700" text-anchor="middle">ACTIVE ROLE</text>
  <text x="140" y="215" fill="#f3f5f7" font-family="'Manrope', -apple-system, sans-serif" font-size="18" font-weight="800">Web Developer</text>
  <text x="140" y="235" fill="#88929b" font-family="'DM Sans', sans-serif" font-size="13">Frontend &amp; API Systems</text>
  
  <!-- Code snippet lines -->
  <rect x="140" y="270" width="180" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="140" y="290" width="220" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/>
  <rect x="140" y="310" width="140" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="140" y="330" width="190" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/>
  <rect x="140" y="365" width="100" height="24" rx="6" fill="#d8ff55"/>
  <text x="190" y="381" fill="#080a0d" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">React &amp; Node</text>

  <!-- Metric / Architecture Card Right -->
  <rect x="405" y="135" width="275" height="125" rx="10" fill="#11161d" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="425" y="165" fill="#88929b" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Focus Areas</text>
  <text x="425" y="195" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="20" font-weight="800">Modern Architecture</text>
  <text x="425" y="222" fill="#d8ff55" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500">Components · REST APIs · Tailwind</text>

  <rect x="405" y="280" width="275" height="125" rx="10" fill="#11161d" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="425" y="310" fill="#88929b" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Impact</text>
  <text x="425" y="340" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="20" font-weight="800">Hands-on Practice</text>
  <text x="425" y="367" fill="#6f82ff" font-family="'DM Sans', sans-serif" font-size="12" font-weight="500">Real-world Application Workflows</text>
</svg>

